# Reproducible training plan. Replace every required placeholder before approval.
job_id: train-<experiment-id>
type: train
entrypoint: src/train.py
config_style: argument

matrix:
  lora_rank: [4, 8, 16, 32]

parameters:
  model_name: <model-name>
  dataset_name: <dataset-name>
  dataset_split: train
  learning_rate: 2.0e-4
  num_epochs: 3
  batch_size: 8
  gradient_accumulation_steps: 4
  seed: 42

# For GPU work in an SSH-targeted project, Slurm is planned metadata only in Phase 4.
resources:
  backend: slurm
  status: planned_unverified
  available_phase: 6
  gpus: 1
  cpus: 8
  memory_gb: 32
  time: "08:00:00"

# Planned destination metadata; no live verification occurs before Phase 7.
wandb:
  enabled: true
  status: planned_unverified
  available_phase: 7
  entity: <wandb-entity>
  project: <wandb-project>
  group: <experiment-id>
  tags:
    - lora-rank-ablation

# Planned artifact policy; no upload or live verification occurs before Phase 8.
huggingface:
  push: milestone
  status: planned_unverified
  available_phase: 8
  namespace: <huggingface-namespace>
  repo: <huggingface-repository>
  private: <true-or-false>

# Origins: user, project_setting, prior_evidence, or agent_default.
provenance:
  matrix.lora_rank:
    origin: <origin>
    source: <user-turn-evidence-ref-or-assumption>
  parameters.model_name:
    origin: <origin>
    source: <user-turn-project-setting-or-evidence-ref>
  parameters.dataset_name:
    origin: <origin>
    source: <user-turn-project-setting-or-evidence-ref>
  controlled_parameters:
    origin: <origin>
    source: <user-turn-evidence-ref-or-assumption>
  resources:
    origin: project_setting
    source: project-plan.md
  wandb:
    origin: project_setting
    source: project-plan.md
  huggingface:
    origin: project_setting
    source: project-plan.md
