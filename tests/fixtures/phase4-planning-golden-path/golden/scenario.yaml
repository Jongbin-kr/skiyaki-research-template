schema_version: 1
scenario_id: lora-rank-ablation-golden
phase: 4
request: Run a LoRA rank ablation.
source_workspace: source-workspace
transcript: transcript.yaml
action_manifest: action-manifest.yaml
expected:
  discovery_report: expected/discovery-report.yaml
  plan: expected/experiments/lora-rank-ablation/plan.md
  train_job: expected/experiments/lora-rank-ablation/jobs/train.yaml
  evaluate_job: expected/experiments/lora-rank-ablation/jobs/evaluate.yaml
  approval_summary: expected/approval-summary.md
protected_paths:
  - experiments/example-lora-rank-ablation
workflow_states:
  - requested
  - discovered
  - grilling
  - decisions_resolved
  - artifacts_validated
  - awaiting_approval
decisions:
  research_objective:
    key: research_objective
    value: Determine whether LoRA rank 16 remains the lowest-cost rank that preserves mean validation accuracy across multiple seeds for RoBERTa-base on GLUE SST-2.
    origin: user
    rationale: The user selected stability of the prior efficiency recommendation as the follow-up objective.
    evidence_ids: [project-plan-objective, prior-journal]
    assumption: false
    resolved: true
  baseline:
    key: baseline
    value:
      configuration: LoRA rank 16, seed 17
      metric: accuracy
      value: 0.874
      dataset: glue/sst2
      split: validation
    origin: user
    rationale: The user confirmed the repository-supported efficiency-selected prior result as the comparison baseline.
    evidence_ids: [prior-results, prior-journal]
    assumption: false
    resolved: true
  primary_metric:
    key: primary_metric
    value:
      name: accuracy
      direction: maximize
      aggregation: mean_across_seeds
      split: validation
    origin: user
    rationale: The user chose mean validation accuracy to compare ranks across seeds.
    evidence_ids: [project-plan-evaluation, prior-results]
    assumption: false
    resolved: true
  success_criteria:
    key: success_criteria
    value:
      metric: accuracy
      comparison: mean_validation_accuracy
      operator: gte
      threshold: 0.874
    origin: user
    rationale: The user required the selected rank's mean validation accuracy to meet or exceed the 0.874 baseline.
    evidence_ids: [prior-results]
    assumption: false
    resolved: true
  ablation_scope:
    key: ablation_scope
    value:
      lora_rank: [8, 16, 32]
      seed: [17, 42, 73]
    origin: user
    rationale: The user chose the evidence-recommended narrower rank matrix and three-seed coverage.
    evidence_ids: [project-log-next-step, prior-journal]
    assumption: false
    resolved: true
  controlled_parameters:
    key: controlled_parameters
    value:
      model_name: roberta-base
      dataset_name: glue
      dataset_config: sst2
      learning_rate: 2.0e-4
      num_epochs: 3
      effective_batch_size: 32
      lora_alpha_rule: twice_rank
      lora_dropout: 0.1
      lora_target_modules: [query, value]
    origin: user
    rationale: The user confirmed reusing the prior experiment's controls so rank and seed are the only manipulated variables.
    evidence_ids: [prior-train-job, prior-plan]
    assumption: false
    resolved: true
