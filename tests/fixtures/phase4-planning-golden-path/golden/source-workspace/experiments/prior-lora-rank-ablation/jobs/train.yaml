schema_version: 1
job_id: train-prior-lora-ranks
type: train
entrypoint: src/train_lora.py
config_style: argument
matrix:
  lora_rank: [4, 8, 16, 32]
parameters:
  model_name: roberta-base
  dataset_name: glue
  dataset_config: sst2
  dataset_split: train
  learning_rate: 2.0e-4
  num_epochs: 3
  batch_size: 8
  gradient_accumulation_steps: 4
  seed: 17
  lora_alpha_rule: twice_rank
  lora_dropout: 0.1
  lora_target_modules: [query, value]
  evaluation_split: validation
resources:
  backend: slurm
  gpus: 1
  cpus: 8
  memory_gb: 32
  time: "08:00:00"
tracking:
  wandb:
    mode: historical_fixture
    group: prior-lora-rank-ablation
artifacts:
  huggingface:
    push_policy: final_only
    destination: fixture-nlp-lab/prior-lora-rank-ablation
