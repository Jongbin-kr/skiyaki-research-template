# Resolved Job Configuration (Example)
# 
# This is the exact configuration used for this run, with all matrix values resolved.

job_id: train-lora-rank
type: train

# Execution
entrypoint: src/train_lora.py
config_style: argument

# Resolved parameters (matrix expanded)
parameters:
  model_name: roberta-base
  dataset_name: glue
  dataset_config: sst2
  dataset_split: train
  learning_rate: 2.0e-4
  num_epochs: 3
  batch_size: 8
  gradient_accumulation_steps: 4
  seed: 42
  
  # LoRA parameters (resolved)
  lora_rank: 16
  lora_alpha: 32  # 2 × 16
  lora_dropout: 0.1
  lora_target_modules: ["query", "value"]
  
  # Output configuration
  output_dir: outputs/example-lora-rank-ablation/train-r16__20250115T142530
  save_strategy: epoch
  logging_steps: 50
  eval_steps: 500

# Resource requirements
resources:
  backend: slurm
  gpus: 1
  cpus: 8
  memory_gb: 32
  time: "08:00:00"

# Weights & Biases tracking
wandb:
  enabled: true
  group: example-lora-rank-ablation
  tags:
    - lora
    - ablation
    - roberta
    - sst2
    - example
  run_name: train-r16__20250115T142530

# Hugging Face Hub
huggingface:
  push: milestone
  repo: my-lab/roberta-base-sst2-lora-r16
